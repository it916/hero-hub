<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin — Hero Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="loading" class="login-container"><div class="login-card"><p>Verificando acceso...</p></div></div>

  <div id="admin-panel" style="display:none;">
    <header class="hero-topbar">
      <div class="topbar-inner">
        <div class="brand-block">
          <div class="logo-mark"><svg viewBox="0 0 100 100"><path d="M50 5 L60 35 L92 38 L67 58 L75 90 L50 72 L25 90 L33 58 L8 38 L40 35 Z" fill="currentColor"/></svg></div>
          <div>
            <div class="brand-name">ADMIN · HERO HUB</div>
            <div class="brand-sub">Panel de administración</div>
          </div>
        </div>
        <div class="topbar-actions">
          <a href="index.html" class="icon-btn" title="Volver al Hub"><i data-lucide="arrow-left"></i></a>
        </div>
      </div>
    </header>

    <main class="admin-main">

      <!-- HERO SPOTLIGHT -->
      <section class="admin-section">
        <h2>🌟 Hero Spotlight</h2>
        <p class="admin-help">Configura el héroe (o los héroes) destacados del mes, con su imagen de portada.</p>

        <label>URL de imagen de fondo
          <input id="sp-image" type="url" placeholder="https://i.ibb.co/...">
        </label>

        <div id="sp-preview-wrap" style="display:none;">
          <label>Vista previa</label>
          <div class="sp-preview" id="sp-preview"></div>
        </div>

        <label>Mensaje destacado (opcional)
          <textarea id="sp-message" rows="3" placeholder="Por ser los HERO's que con sus superpoderes..."></textarea>
        </label>

        <label style="margin-bottom:10px;">Honorados (hasta 3)</label>
        <div id="sp-honorees-list"></div>
        <button class="btn-ghost-dark" id="sp-add-honoree" style="margin-top:10px;">+ Agregar honorado</button>

        <div style="margin-top:24px;">
          <button class="btn-primary" id="sp-save">Guardar Spotlight</button>
          <span class="save-status" id="sp-status"></span>
        </div>
      </section>

      <!-- MENSAJES -->
      <section class="admin-section">
        <h2>💬 Mensajes motivacionales</h2>
        <p class="admin-help">Frases que rotan automáticamente en el widget "Mensaje del día".</p>
        <div id="ms-list"></div>
        <div class="add-row">
          <input id="ms-text" placeholder="Nuevo mensaje motivacional...">
          <button class="btn-primary" id="ms-add">Agregar</button>
        </div>
      </section>

    </main>
  </div>

  <script>
    window.refreshIcons = () => { if (window.lucide) lucide.createIcons(); };
    document.addEventListener("DOMContentLoaded", () => window.refreshIcons());
  </script>
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
