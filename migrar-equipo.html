<!DOCTYPE html>

<head>

<title>Migrar Equipo · Hero Hub</title>
<style>
  body { font-family:system-ui,sans-serif; background:#0a3d4a; color:#fff; padding:40px; max-width:720px; margin:0 auto; }
  h1 { color:#06a3b6; }
  button { background:#06a3b6; color:#fff; border:none; padding:14px 28px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; margin:20px 0; }
  button:disabled { opacity:.5; cursor:wait; }
  #log { background:#062a33; padding:20px; border-radius:10px; margin-top:20px; font-family:monospace; font-size:13px; white-space:pre-wrap; max-height:400px; overflow-y:auto; }
  .ok { color:#10b981; } .err { color:#f43f5e; } .info { color:#7a9aa5; }
  code { background:#062a33; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>

  { name:'Eduardo Romero', role:'Office Manager', email:['officemanager@heroinsuranceusa.com'], phone:[], country:'Venezuela', photo:'https://i.ibb.co/h0GTBhG/circulo-EDUARDO-OO.png' },
  { name:'Fernando Romero', role:'IT & Technology Manager', email:['it@heroinsuranceusa.com'], phone:['+58 414-7796723'], country:'Venezuela', photo:'https://i.imgur.com/zUyf42Y.png' },
  { name:'Gilbana Barroso', role:'Finance Support', email:['financesupport@heroinsuranceusa.com'], phone:['+1 (954) 551-8813'], country:'Venezuela', photo:'https://i.imgur.com/v0qMpnk.png' },

  { name:'Ramón Portillo', role:'Broker Support', email:['brokersupport@heroinsuranceusa.com'], phone:['(954) 551-0254','(786) 323-6818'], country:'Venezuela', photo:'https://i.imgur.com/uDgo3D2.png' },
  { name:'Samuel Ortiz', role:'Executive Assistant to the CFO', email:['samortiz@heroinsuranceusa.com'], phone:['+1 (954) 551-8813'], country:'Cuba', photo:'https://i.ibb.co/tPZg76Dx/Samuel.png' },
];

function log(msg, cls="") {
  const el = document.getElementById("log");
  el.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

onAuthStateChanged(auth, async (user) => {
  const btn = document.getElementById("btn-migrar");
  if (!user) {
    log("🔐 Iniciando sesión...", "info");
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e) { log("❌ Login cancelado", "err"); }
    return;
  }
  if (user.email !== "it@heroinsuranceusa.com") {
    log(`❌ Solo it@heroinsuranceusa.com puede migrar. Estás como ${user.email}`, "err"); return;
  }
  log(`✅ Autenticado como ${user.email}`, "ok");
  log(`📋 ${MEMBERS.length} miembros listos.`, "info");
  btn.disabled = false;
  btn.textContent = "Ejecutar migración";
});

document.getElementById("btn-migrar").addEventListener("click", async () => {
  const btn = document.getElementById("btn-migrar");
  btn.disabled = true; btn.textContent = "Migrando...";
  try {
    log(`📤 Escribiendo ${MEMBERS.length} miembros a shared/team...`, "info");
    await setDoc(doc(db, "shared", "team"), { members: MEMBERS });
    log(`✅ ¡Completado! ${MEMBERS.length} miembros guardados.`, "ok");
    log(`🎉 Borra migrar-equipo.html del repo.`, "ok");
    btn.textContent = "✅ Completado";
  } catch (e) {
    log(`❌ Error: ${e.message}`, "err");
    console.error(e);
    btn.disabled = false; btn.textContent = "Reintentar";
  }
});
</script>
</body>
</html>
