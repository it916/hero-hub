<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Migrar Frases · Hero Hub</title>
<style>
  body { font-family:system-ui,sans-serif; background:#0a3d4a; color:#fff; padding:40px; max-width:720px; margin:0 auto; }
  h1 { color:#06a3b6; }
  button { background:#06a3b6; color:#fff; border:none; padding:14px 28px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; margin:20px 0; }
  button:disabled { opacity:.5; cursor:wait; }
  #log { background:#062a33; padding:20px; border-radius:10px; margin-top:20px; font-family:monospace; font-size:13px; white-space:pre-wrap; max-height:400px; overflow-y:auto; }
  .ok { color:#10b981; } .err { color:#f43f5e; } .info { color:#7a9aa5; }
  code { background:#062a33; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
  <h1>🔄 Migración de frases → Firestore</h1>
  <p>Migra las 14 frases del Supabase antiguo a <code>shared/messages</code>. Ejecútalo una sola vez.</p>
  <button id="btn-migrar" disabled>Cargando...</button>
  <div id="log"></div>

<script type="module">
import { auth, db } from "./js/firebase-config.js";
import { GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const FRASES = [
  { frase:"Primero muerta que sencilla mi ciela", autor:"Maria Alejandra", created_at:"2026-03-03T15:21:46.361Z" },
  { frase:"Si estas estresado... no te estreses.", autor:"Anonimo", created_at:"2026-03-26T17:50:06.380Z" },
  { frase:"No hay una segunda oportunidad, para una primera impresión", autor:"Diego", created_at:"2026-03-18T18:29:35.265Z" },
  { frase:"Los restos de uno, son el tesoro de otros", autor:"Pablo Picasso", created_at:"2026-03-12T15:33:28.074Z" },
  { frase:"Espectacular 🎉 ✨", autor:"Maria Alejandra", created_at:"2026-03-06T19:52:30.310Z" },
  { frase:"Cuando el cambio trae incomodidad, no es cambio.", autor:"Aurys", created_at:"2026-03-05T21:25:16.312Z" },
  { frase:"Siempre el más, nunca el menos, y mucho menos el más o menos.", autor:"Anonimo", created_at:"2026-03-12T16:31:31.462Z" },
  { frase:"Camarón que se duerme, ni que lo fajen chiquito", autor:"Jesús G.", created_at:"2026-03-03T03:42:11.417Z" },
  { frase:"Archivo que se devuelve, se esnuca", autor:"Alguien, en algun momento", created_at:"2026-03-12T22:19:42.343Z" },
  { frase:"Se te perdio la playa? 🏖️", autor:"Diego", created_at:"2026-03-06T19:13:23.610Z" },
  { frase:"Cuando nos esforzamos en ser mejores de lo que somos, todo a nuestro alrededor mejora", autor:"Paulo Coelho", created_at:"2026-03-04T12:18:20.518Z" },
  { frase:"confia, porque si no confias, no hay confianza :)", autor:"migue", created_at:"2026-03-06T18:26:11.938Z" },
  { frase:"TODO FUNCIONA PARA TU BIEN :)", autor:"Maria Lo Monaco", created_at:"2026-03-06T16:23:27.748Z" },
  { frase:"Hoy no se trabaja, y mañana tampoco.", autor:"Anónimo", created_at:"2026-03-03T15:22:19.619Z" }
];

function log(msg, cls="") {
  const el = document.getElementById("log");
  el.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

onAuthStateChanged(auth, async (user) => {
  const btn = document.getElementById("btn-migrar");
  if (!user) {
    log("🔐 Iniciando sesión con Google...", "info");
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e) { log("❌ Login cancelado", "err"); }
    return;
  }
  if (user.email !== "it@heroinsuranceusa.com") {
    log(`❌ Solo it@heroinsuranceusa.com puede migrar. Estás como ${user.email}`, "err"); return;
  }
  log(`✅ Autenticado como ${user.email}`, "ok");
  log(`📋 ${FRASES.length} frases listas. Click en el botón para migrar.`, "info");
  btn.disabled = false;
  btn.textContent = "Ejecutar migración";
});

document.getElementById("btn-migrar").addEventListener("click", async () => {
  const btn = document.getElementById("btn-migrar");
  btn.disabled = true; btn.textContent = "Migrando...";
  try {
    const items = FRASES.map(f => ({
      id: crypto.randomUUID(),
      frase: f.frase,
      autor: f.autor,
      created_at: f.created_at
    }));
    log(`📤 Escribiendo ${items.length} frases a shared/messages...`, "info");
    await setDoc(doc(db, "shared", "messages"), { items });
    log(`✅ ¡Migración completada! ${items.length} frases guardadas.`, "ok");
    log(`🎉 Ahora puedes borrar este archivo migrar-frases.html del repo.`, "ok");
    btn.textContent = "✅ Completado";
  } catch (e) {
    log(`❌ Error: ${e.message}`, "err");
    console.error(e);
    btn.disabled = false; btn.textContent = "Reintentar";
  }
});
</script>
</body>
</html>
