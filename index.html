<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Hub — Hero Insurance USA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="login-screen" class="login-container" style="display:none;">
    <div class="login-card">
      <div class="masthead-mini">HERO INSURANCE USA · EST. 2024</div>
      <h1>Hero Hub</h1>
      <p class="login-tagline">Portal interno · Volumen II</p>
      <div class="login-rule"></div>
      <button id="btn-login" class="btn-primary">Iniciar sesión con Google →</button>
      <p id="login-error" class="error-msg"></p>
      <small>Solo cuentas <strong>@heroinsuranceusa.com</strong></small>
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    <header class="masthead">
      <div class="masthead-row">
        <div class="masthead-meta-left" id="masthead-date">—</div>
        <div class="masthead-title">Hero Hub</div>
        <div class="masthead-meta-right">
          <img id="user-avatar" src="" alt="" class="avatar">
          <a id="btn-admin" href="admin.html" class="icon-btn" style="display:none;" title="Admin"><i data-lucide="shield-check"></i></a>
          <button id="btn-settings" class="icon-btn" title="Configuración"><i data-lucide="settings-2"></i></button>
          <button id="btn-logout" class="icon-btn" title="Salir"><i data-lucide="log-out"></i></button>
        </div>
      </div>
      <div class="masthead-rule"></div>
      <nav class="masthead-nav">
        <span>Vol. II</span>
        <span class="sep">·</span>
        <span>Edición Diaria</span>
        <span class="sep">·</span>
        <span id="masthead-issue">Nº —</span>
        <span class="sep">·</span>
        <span>Hero Insurance USA</span>
      </nav>
    </header>

    <section class="lede">
      <div class="kicker">Bienvenido de vuelta</div>
      <h1 id="user-greeting" class="headline">Hola</h1>
      <p class="dek" id="hero-date">—</p>
    </section>

    <main id="widgets-container">
      <p class="loading">Cargando edición...</p>
    </main>

    <footer class="colophon">
      <div class="colophon-rule"></div>
      <div class="colophon-text">
        <span>Hero Hub · Volumen II</span>
        <span class="sep">·</span>
        <span>Hero Insurance USA</span>
        <span class="sep">·</span>
        <span>© 2026</span>
      </div>
    </footer>
  </div>

  <script>
    window.refreshIcons = () => { if (window.lucide) lucide.createIcons(); };
    document.addEventListener("DOMContentLoaded", () => window.refreshIcons());
  </script>
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
