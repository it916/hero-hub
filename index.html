<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Hub — Hero Insurance USA</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- PANTALLA DE LOGIN -->
  <div id="login-screen" class="login-container" style="display:none;">
    <div class="login-card">
      <h1>Hero Hub</h1>
      <p>Portal interno de Hero Insurance USA</p>
      <button id="btn-login" class="btn-primary">
        Iniciar sesión con Google
      </button>
      <p id="login-error" class="error-msg"></p>
      <small>Solo cuentas <strong>@heroinsuranceusa.com</strong></small>
    </div>
  </div>

  <!-- DASHBOARD (oculto hasta que haya login válido) -->
  <div id="dashboard" style="display:none;">
    <header class="hero-header">
      <div class="header-left">
        <h1>Hero Hub</h1>
      </div>
      <div class="header-right">
        <span id="user-greeting"></span>
        <img id="user-avatar" src="" alt="avatar" class="avatar">
        <button id="btn-logout" class="btn-ghost">Salir</button>
      </div>
    </header>

    <main id="widgets-container">
      <p class="loading">Cargando tu Hub...</p>
    </main>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
