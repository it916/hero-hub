<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Hub — Hero Insurance USA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="login-screen" class="login-container" style="display:none;">
    <div class="login-card">
      <div class="login-mark">H</div>
      <h1>Hero Hub</h1>
      <p>Portal interno · Hero Insurance USA</p>
      <button id="btn-login" class="btn-primary">
        <span>Iniciar sesión con Google</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
      <p id="login-error" class="error-msg"></p>
      <small>Solo cuentas <strong>@heroinsuranceusa.com</strong></small>
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    <header class="hero-header">
      <div class="header-left">
        <div class="logo-mark">H</div>
        <div>
          <div class="header-brand">Hero Hub</div>
          <div class="header-sub">Hero Insurance USA</div>
        </div>
      </div>
      <div class="header-right">
        <img id="user-avatar" src="" alt="" class="avatar">
        <a id="btn-admin" href="admin.html" class="icon-btn" style="display:none;" title="Admin"><i data-lucide="shield-check" class="w-5 h-5"></i></a>
        <button id="btn-settings" class="icon-btn" title="Configuración"><i data-lucide="settings-2" class="w-5 h-5"></i></button>
        <button id="btn-logout" class="icon-btn" title="Salir"><i data-lucide="log-out" class="w-5 h-5"></i></button>
      </div>
    </header>

    <section class="hero-banner">
      <div class="banner-grid">
        <div class="banner-greeting">
          <div class="kicker"><span class="kicker-dot"></span>Bienvenido de vuelta</div>
          <h1 id="user-greeting" class="display-greeting">Hola</h1>
          <p id="hero-date" class="hero-date"></p>
        </div>
        <div class="banner-clock">
          <div id="hero-clock" class="clock-time">00:00</div>
          <div class="clock-meta">
            <span id="hero-clock-meridiem">AM</span>
            <span class="dot-sep">·</span>
            <span>Miami, FL</span>
          </div>
        </div>
      </div>
    </section>

    <main id="widgets-container">
      <p class="loading">Cargando tu Hub...</p>
    </main>

    <footer class="hero-footer">
      <span>Hero Hub · v2.0</span>
      <span class="dot-sep">·</span>
      <span>Hero Insurance USA</span>
    </footer>
  </div>

  <script>
    // Activar Lucide después de cualquier render
    window.refreshIcons = () => { if (window.lucide) lucide.createIcons(); };
    document.addEventListener("DOMContentLoaded", () => window.refreshIcons());
  </script>
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
