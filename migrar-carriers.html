function log(msg, cls="") {
  const el = document.getElementById("log");
  el.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

onAuthStateChanged(auth, async (user) => {
  const btn = document.getElementById("btn-migrar");
  if (!user) {
    log("🔐 Iniciando sesión...", "info");
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e) { log("❌ Login cancelado", "err"); }
    return;
  }
  if (user.email !== "it@heroinsuranceusa.com") {
    log(`❌ Solo it@heroinsuranceusa.com puede migrar. Estás como ${user.email}`, "err"); return;
  }
  log(`✅ Autenticado como ${user.email}`, "ok");
  log(`📋 Jesús: ${JESUS.length} portales | Anny: ${ANNY.length} portales`, "info");
  log(`📊 Total: ${JESUS.length + ANNY.length} carriers`, "info");
  btn.disabled = false;
  btn.textContent = "Ejecutar migración";
});

document.getElementById("btn-migrar").addEventListener("click", async () => {
  const btn = document.getElementById("btn-migrar");
  btn.disabled = true; btn.textContent = "Migrando...";
  try {
    // Ordenar alfabéticamente
    JESUS.sort((a,b) => a.nombre.localeCompare(b.nombre));
    ANNY.sort((a,b) => a.nombre.localeCompare(b.nombre));
    log(`📤 Escribiendo a shared/carriers-team...`, "info");
    await setDoc(doc(db, "shared", "carriers-team"), { jesus: JESUS, anny: ANNY });
    log(`✅ ¡Completado! ${JESUS.length + ANNY.length} carriers guardados.`, "ok");
    log(`🎉 BORRA migrar-carriers.html del repo INMEDIATAMENTE.`, "ok");
    btn.textContent = "✅ Completado";
  } catch (e) {
    log(`❌ Error: ${e.message}`, "err");
    console.error(e);
    btn.disabled = false; btn.textContent = "Reintentar";
  }
});
