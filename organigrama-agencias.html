<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organigrama de Agencias — Hero Insurance USA</title>
<style>
  :root {
    --hero-primary: #06a3b6;
    --hero-primary-dark: #048395;
    --hero-bg: #f0f4f8;
    --hero-card-bg: #ffffff;
    --hero-text: #1a2733;
    --hero-text-muted: #5a6b7a;
    --hero-border: #d8e1ea;
    --hero-warning: #e8a317;
    --hero-danger: #d64545;
    --hero-font: 'Trebuchet MS', Arial, sans-serif;
    --hero-radius: 10px;
    --hero-radius-sm: 6px;
    --hero-shadow: 0 2px 8px rgba(6,163,182,0.08);
    --hero-shadow-lg: 0 8px 24px rgba(6,163,182,0.15);
    --friends-primary: #5a4fcf;
    --friends-primary-dark: #463cab;
    --new-primary: #2e8855;
    --new-primary-dark: #226641;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--hero-font);
    background: var(--hero-bg);
    color: var(--hero-text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .header {
    max-width: 1400px; margin: 0 auto 24px;
    background: var(--hero-card-bg);
    border: 1px solid var(--hero-border);
    border-radius: var(--hero-radius);
    padding: 20px 24px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: var(--hero-shadow);
    flex-wrap: wrap;
  }
  .header img { width: 48px; height: 48px; border-radius: 50%; }
  .header-text { flex: 1; min-width: 200px; }
  .header-text h1 { font-size: 22px; color: var(--hero-primary-dark); font-weight: 700; }
  .header-text p { font-size: 14px; color: var(--hero-text-muted); margin-top: 2px; }
  .header-stats {
    display: flex; gap: 16px; font-size: 13px; color: var(--hero-text-muted);
  }
  .stat { text-align: center; }
  .stat-num { font-size: 18px; font-weight: 700; color: var(--hero-primary-dark); }

  .toolbar {
    max-width: 1400px; margin: 0 auto 20px;
    display: flex; flex-wrap: wrap; gap: 12px;
    justify-content: space-between; align-items: center;
  }
  .view-switcher {
    display: inline-flex;
    background: var(--hero-card-bg);
    border: 1px solid var(--hero-border);
    border-radius: var(--hero-radius-sm);
    padding: 4px;
    box-shadow: var(--hero-shadow);
  }
  .view-btn {
    padding: 8px 16px; border: none; background: transparent;
    color: var(--hero-text-muted);
    font-family: var(--hero-font); font-size: 14px; font-weight: 600;
    border-radius: var(--hero-radius-sm); cursor: pointer;
    transition: all 0.2s ease;
  }
  .view-btn.active { background: var(--hero-primary); color: white; }
  .view-btn:hover:not(.active) { background: var(--hero-bg); color: var(--hero-text); }

  .download-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .download-btn {
    padding: 8px 14px;
    border: 1px solid var(--hero-border);
    background: var(--hero-card-bg);
    color: var(--hero-text);
    font-family: var(--hero-font);
    font-size: 13px; font-weight: 600;
    border-radius: var(--hero-radius-sm);
    cursor: pointer; transition: all 0.2s ease;
    display: inline-flex; align-items: center; gap: 6px;
    box-shadow: var(--hero-shadow);
  }
  .download-btn:hover { background: var(--hero-primary); color: white; border-color: var(--hero-primary); }
  .download-btn svg { width: 14px; height: 14px; }

  .legend {
    max-width: 1400px; margin: 0 auto 20px;
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--hero-text-muted);
    background: var(--hero-card-bg);
    border: 1px solid var(--hero-border);
    border-radius: var(--hero-radius-sm);
    padding: 6px 12px;
  }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot-hero { background: var(--hero-primary); }
  .dot-friends { background: var(--friends-primary); }
  .dot-new { background: var(--new-primary); }
  .dot-sub { background: var(--hero-warning); }
  .dot-pending { background: var(--hero-text-muted); }
  .dot-hold { background: var(--hero-danger); }

  .view { display: none; }
  .view.active { display: block; }

  /* MAPA */
  .map-wrapper {
    max-width: 1400px; margin: 0 auto;
    background: var(--hero-card-bg);
    border: 1px solid var(--hero-border);
    border-radius: var(--hero-radius);
    padding: 24px;
    box-shadow: var(--hero-shadow);
    overflow-x: auto;
  }
  #conceptMap { display: block; margin: 0 auto; width: 100%; max-width: 1400px; height: auto; }

  /* DETALLADA */
  .org-wrapper {
    max-width: 1400px; margin: 0 auto;
    background: var(--hero-card-bg);
    border: 1px solid var(--hero-border);
    border-radius: var(--hero-radius);
    padding: 32px 24px;
    box-shadow: var(--hero-shadow);
  }
  .branches {
    display: grid; grid-template-columns: 1fr 1fr; gap: 32px;
    margin-bottom: 32px;
  }
  .root-card {
    background: linear-gradient(135deg, var(--hero-primary), var(--hero-primary-dark));
    color: white; padding: 20px 24px;
    border-radius: var(--hero-radius);
    text-align: center;
    box-shadow: var(--hero-shadow-lg);
    margin-bottom: 24px;
    position: relative;
  }
  .root-card.friends { background: linear-gradient(135deg, var(--friends-primary), var(--friends-primary-dark)); }
  .root-card h2 { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  .root-card .root-sub { font-size: 13px; opacity: 0.9; margin-top: 4px; }
  .root-card::after {
    content: ''; position: absolute; bottom: -24px; left: 50%;
    width: 2px; height: 24px; background: var(--hero-border);
  }

  .matrix-aic-card {
    background: linear-gradient(135deg, #e0f4f7, #f0f4f8);
    border: 1px solid var(--hero-primary-dark);
    border-radius: var(--hero-radius);
    padding: 14px 18px;
    margin-bottom: 16px;
    text-align: center;
  }
  .matrix-aic-card.friends { background: linear-gradient(135deg, #ece9fb, #f0f4f8); border-color: var(--friends-primary-dark); }
  .matrix-aic-card .aic-label {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--hero-text-muted); font-weight: 700;
  }
  .matrix-aic-card .aic-name {
    font-size: 16px; font-weight: 700; color: var(--hero-primary-dark);
    margin-top: 4px;
  }
  .matrix-aic-card.friends .aic-name { color: var(--friends-primary-dark); }

  .branch-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--hero-text-muted); margin-bottom: 12px; font-weight: 600;
    text-align: center; padding-top: 8px;
  }

  .agencies-list { display: flex; flex-direction: column; gap: 12px; }
  .agency-card {
    background: var(--hero-card-bg);
    border: 1px solid var(--hero-border);
    border-left: 4px solid var(--hero-primary);
    border-radius: var(--hero-radius-sm);
    padding: 14px 16px;
    transition: all 0.2s ease;
    box-shadow: var(--hero-shadow);
  }
  .agency-card:hover { box-shadow: var(--hero-shadow-lg); }
  .agency-card.friends-branch { border-left-color: var(--friends-primary); }
  .agency-card.new-branch { border-left-color: var(--new-primary); }
  .agency-card.sub {
    margin-left: 32px;
    border-left-color: var(--hero-warning);
    background: #fffbf2;
  }
  .agency-card.pending-card {
    border-left-color: var(--hero-warning);
    background: #fffbf2;
  }
  .agency-card.hold-card {
    border-left-color: var(--hero-danger);
    background: #fdf3f3;
  }

  .agency-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .agency-name { font-size: 15px; font-weight: 700; color: var(--hero-text); }
  .agency-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; padding: 3px 8px; border-radius: 12px;
    font-weight: 600; letter-spacing: 0.3px;
  }
  .badge-pending { background: #eef2f7; color: var(--hero-text-muted); }
  .badge-sub { background: #fef3d4; color: #8a6410; }
  .badge-hold { background: #fde2e2; color: var(--hero-danger); }
  .badge-warning { background: #fff4e0; color: #8a6410; }
  .badge-count { background: #e0f4f7; color: var(--hero-primary-dark); }

  .agent-in-charge {
    margin-top: 8px; padding: 8px 10px;
    background: #f0f4f8; border-radius: var(--hero-radius-sm);
    border-left: 3px solid var(--hero-primary);
    font-size: 12px;
  }
  .agent-in-charge .aic-label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--hero-text-muted); font-weight: 700;
  }
  .agent-in-charge .aic-name {
    font-size: 13px; font-weight: 700; color: var(--hero-primary-dark);
  }
  .agency-card.friends-branch .agent-in-charge { border-left-color: var(--friends-primary); }
  .agency-card.friends-branch .agent-in-charge .aic-name { color: var(--friends-primary-dark); }
  .agency-card.new-branch .agent-in-charge { border-left-color: var(--new-primary); }
  .agency-card.new-branch .agent-in-charge .aic-name { color: var(--new-primary-dark); }

  .agency-note { font-size: 12px; color: var(--hero-text-muted); margin-top: 4px; font-style: italic; }

  .brokers-section { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--hero-border); }
  .brokers-toggle {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
    color: var(--hero-text-muted); font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .brokers-toggle:hover { color: var(--hero-primary-dark); }
  .brokers-toggle .arrow { transition: transform 0.2s ease; }
  .brokers-toggle.open .arrow { transform: rotate(90deg); }
  .brokers-list {
    display: none; margin-top: 8px;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 4px;
  }
  .brokers-list.open { display: grid; }
  .broker-item {
    font-size: 12px; color: var(--hero-text);
    padding: 4px 8px;
    background: #f9fafb;
    border-radius: 4px;
  }

  .carriers-section {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed var(--hero-border);
    font-size: 12px; color: var(--hero-text-muted);
  }
  .carriers-section .carriers-label {
    font-weight: 600; text-transform: uppercase; font-size: 10px;
    letter-spacing: 0.5px; color: var(--hero-primary-dark); margin-bottom: 4px;
  }
  .carriers-placeholder { font-style: italic; color: var(--hero-text-muted); }

  .pending-section {
    max-width: 1400px; margin: 24px auto 0;
    border-radius: var(--hero-radius);
    padding: 20px 24px;
  }
  .pending-section {
    background: #fffbf2;
    border: 1px solid var(--hero-warning);
    border-left: 4px solid var(--hero-warning);
  }
  .pending-section h3 {
    font-size: 16px; color: #8a6410;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .pending-section h3::before { content: ''; font-size: 18px; }

  .footer {
    max-width: 1400px; margin: 32px auto 0;
    text-align: center; color: var(--hero-text-muted);
    font-size: 12px; padding: 16px;
  }

  @media (max-width: 768px) {
    .branches { grid-template-columns: 1fr; gap: 24px; }
    .agency-card.sub { margin-left: 16px; }
    .header { flex-direction: column; text-align: center; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .view-switcher, .download-group { justify-content: center; }
  }

  @media print {
    body { background: white; padding: 0; }
    .toolbar, .legend, .brokers-toggle .arrow { display: none; }
    .view { display: block !important; page-break-after: always; }
    .brokers-list { display: grid !important; }
  }
</style>
</head>

"Luis Coll Sr", "Gladytza Acasio", "Angely Hectgari Parra Salcedo", "Alberto Caraballo Montoya", "Cristina Castillo de Ramirez", "Laura Martinez"]}, {"name": "THE KAIZEN TEAM", "kind": "normal", "aic": ["Anny Medina Silva"], "brokers": ["Maria Valentina Gomez Moya", "Noritsha Gimenez", "Jhonnie Ardvison Garcia Montoya", "Ana L Hernandez Gavidia", "Jhonattan Heriberto Monsalve Dugarte", "Carla Andrea Bermudez Escalona", "Karin del Valle Gutierrez Beleno", "Mariangel Rojas", "Katerin Castillo"]}, {"name": "A&Z COUPLE", "kind": "normal", "aic": ["Alejandro Diaz Gonzalez"], "brokers": ["Vivian Gonzalez", "Yaricel Rodriguez Romero", "Arisdelbis Sr Fernandez Tovar", "Ernelvys Perez", "Yurima Soto", "Leixy Dominguez Rodriguez", "Magdalena Santamaria Luna", "Isabel Maria Pedroso", "Tahimi Sosa Alfonso"]}, {"name": "VIPERCARE", "kind": "normal", "aic": ["Eduardo Jose Viquez"], "brokers": ["Cecilia Perera", "Roberto Pena", "Reneria Garcia"]}, {"name": "KHAN FINANCIAL SERVICES", "kind": "normal", "aic": ["Diana Khan"], "brokers": ["Fiona Angus-Powell", "Analizser Royer", "Marsha Philippa Spence", "Tamara Bantin Latoya"]}, {"name": "ZT INSURANCE", "kind": "normal", "aic": ["Zulima Torres"], "brokers": ["Madaisy Cueto Sanchez", "Maria A Diaz Alvarez", "Luis Caicedo"]}, {"name": "ALLTIMES SAFE", "kind": "normal", "aic": ["Karina D. Farias"], "brokers": ["Pedro Pacheco", "Dulfa Carolina Martinez"]}, {"name": "GROWING UP", "kind": "normal", "aic": ["Angel Hernandez"], "brokers": []}, {"name": "ENSURE", "kind": "normal", "aic": ["Maydelis Cabrera"], "brokers": ["Francisco Umana", "Livan Mujica", "Marcelle Fatal", "Maria A Trejos", "Nelson Bravo Figueredo", "Odaimys Perez", "Odalys Valdes Fernandez", "Yaines Pujol Santana", "Christina Tejeda", "Daniel Sierra", "Maydelis Cabrera Ensenat", "Mirelys Cabrera Ensenat", "Vanessa Feliciano Blanco", "Kristen Umanzor", "Alexander Gil Diaz", "Yailien Perez Carrillo", "Noslen Sanchez-Mesa", "Julian Abreu-Machado", "Jessenia Jimenez", "Jeslene S // ==================== BUILD STATS ====================
function buildStats() {
  let agencias = 0, aic = 0, brokers = 0;
  for (const grupo of ['hero','friends','pending']) {
    for (const ag of STRUCTURE[grupo]) {
      agencias++;
      if (ag.aic.length > 0) aic += ag.aic.length;
      brokers += ag.brokers.length;
    }
  }
  document.getElementById('stat-agencias').textContent = agencias;
  document.getElementById('stat-aic').textContent = aic;
  document.getElementById('stat-brokers').textContent = brokers;
}

// ==================== BUILD DETAILED VIEW ====================
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildAgencyCard(ag, branchClass) {
  const isMatrix = ag.kind === 'matrix';
  if (isMatrix) return ''; // matrix se muestra en root-card

  let extraClass = branchClass || '';
  if (ag.kind === 'sub_goldpro') extraClass = 'sub';
  if (ag.kind === 'unclear') extraClass = 'pending-card';
  if (ag.kind === 'on_hold') extraClass = 'hold-card';

  let badges = [];
  if (ag.kind === 'sub_goldpro') badges.push('<span class="badge badge-sub">Subagencia de Gold Pro</span>');
  if (ag.kind === 'info_limited') badges.push('<span class="badge badge-warning">Info limitada</span>');
  if (ag.kind === 'unclear') badges.push('<span class="badge badge-warning">¿Hero o Friends?</span>');
  if (ag.kind === 'on_hold') badges.push('<span class="badge badge-hold">On Hold</span>');
  if (ag.kind === 'no_data') badges.push('<span class="badge badge-pending">Sin agentes en listado</span>');
  if (ag.brokers.length > 0) badges.push('<span class="badge badge-count">' + ag.brokers.length + ' brokers</span>');

  let aicHtml = '';
  if (ag.aic.length > 0) {
    aicHtml = '<div class="agent-in-charge">'
      + '<div class="aic-label">Agent in Charge</div>'
      + '<div class="aic-name">' + escapeHtml(ag.aic[0]) + '</div>'
      + '</div>';
  }

  let prefix = '';
  if (ag.kind === 'sub_goldpro') prefix = '↳ ';

  let note = '';
  if (ag.kind === 'info_limited') note = '<div class="agency-note">Solo se conoce que es de Jhon Galindo. Información limitada.</div>';

  let brokersHtml = '';
  if (ag.brokers.length > 0) {
    const brokerItems = ag.brokers.map(b => '<div class="broker-item">' + escapeHtml(b) + '</div>').join('');
    brokersHtml = '<div class="brokers-section">'
      + '<div class="brokers-toggle" onclick="toggleBrokers(this)">'
      + '<span>Brokers (' + ag.brokers.length + ')</span>'
      + '<span class="arrow">▶</span>'
      + '</div>'
      + '<div class="brokers-list">' + brokerItems + '</div>'
      + '</div>';
  }

  return '<div class="agency-card ' + extraClass + '">'
    + '<div class="agency-header">'
    + '<div class="agency-name">' + prefix + escapeHtml(ag.name.toUpperCase()) + '</div>'
    + '<div class="agency-badges">' + badges.join('') + '</div>'
    + '</div>'
    + note
    + aicHtml
    + brokersHtml
    + '<div class="carriers-section">'
    + '<div class="carriers-label">Carriers</div>'
    + '<div class="carriers-placeholder">— Pendiente por agregar —</div>'
    + '</div>'
    + '</div>';
}

function toggleBrokers(toggle) {
  toggle.classList.toggle('open');
  toggle.nextElementSibling.classList.toggle('open');
}

// ==================== BUILD MAP ====================
function buildMap() {
  // Calcular layout del mapa con datos
  const heroAgencies = STRUCTURE.hero.filter(a => a.kind !== 'matrix' && a.kind !== 'sub_goldpro');
  const apInsurance = STRUCTURE.hero.find(a => a.kind === 'sub_goldpro');
  const goldPro = STRUCTURE.hero.find(a => a.name.toUpperCase() === 'GOLD PRO');
  const friendsAgencies = STRUCTURE.friends.filter(a => a.kind !== 'matrix');
  const heroMatrix = STRUCTURE.hero.find(a => a.kind === 'matrix');
  const friendsMatrix = STRUCTURE.friends.find(a => a.kind === 'matrix');

  // Posiciones radiales para Hero
  const heroPositions = [
    {x: 130, y: 220}, {x: 100, y: 305}, {x: 190, y: 385}, {x: 350, y: 465},
    {x: 540, y: 305}, {x: 540, y: 385}, {x: 630, y: 220}, {x: 700, y: 165},
    {x: 700, y: 250}, {x: 900, y: 165}, {x: 910, y: 235}, {x: 915, y: 300}, {x: 950, y: 365}
  ];

  // Filtrar Gold Pro de heroAgencies para procesarlo aparte
  const heroAgsNoGold = heroAgencies.filter(a => a.name.toUpperCase() !== 'GOLD PRO');

  let svg = '<svg id="conceptMap" viewBox="0 0 1300 1180" xmlns="http://www.w3.org/2000/svg">';
  svg += '<defs>';
  svg += '<linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#06a3b6"/><stop offset="100%" stop-color="#048395"/></linearGradient>';
  svg += '<linearGradient id="friendsGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#5a4fcf"/><stop offset="100%" stop-color="#463cab"/></linearGradient>';
  svg += '<linearGradient id="newGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2e8855"/><stop offset="100%" stop-color="#226641"/></linearGradient>';
  svg += '<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>';
  svg += '</defs>';

  // Nodo HERO con AIC
  svg += '<ellipse cx="500" cy="100" rx="120" ry="44" fill="url(#heroGrad)" filter="url(#softShadow)"/>';
  svg += '<text x="500" y="92" text-anchor="middle" fill="white" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700">HERO</text>';
  svg += '<text x="500" y="110" text-anchor="middle" fill="white" font-family="Trebuchet MS, Arial, sans-serif" font-size="11" opacity="0.9">Casa matriz</text>';
  if (heroMatrix && heroMatrix.aic.length > 0) {
    svg += '<text x="500" y="128" text-anchor="middle" fill="white" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-weight="600" opacity="0.95">AIC: ' + escapeHtml(heroMatrix.aic[0]) + '</text>';
  }

  // Conectores y agencias Hero
  const positions = [];
  let posIdx = 0;
  for (const ag of heroAgsNoGold) {
    if (posIdx >= heroPositions.length) break;
    const pos = heroPositions[posIdx];
    positions.push({ag, pos});
    // Conector
    svg += '<path d="M ' + (500 + (pos.x < 500 ? -100 : 100)) + ' 130 Q ' + ((500 + pos.x)/2) + ' ' + ((130 + pos.y)/2 - 30) + ' ' + (pos.x + 90) + ' ' + pos.y + '" stroke="#06a3b6" stroke-width="1.5" fill="none" opacity="0.5"/>';
    posIdx++;
  }

  // Dibujar nodos Hero
  for (const {ag, pos} of positions) {
    const hasAIC = ag.aic.length > 0;
    const brokerCount = ag.brokers.length;
    const fill = hasAIC || brokerCount > 0 ? '#e0f4f7' : '#eef2f7';
    const stroke = hasAIC || brokerCount > 0 ? '#06a3b6' : '#5a6b7a';
    const dashArr = (!hasAIC && brokerCount === 0) ? '4 3' : '';
    const textColor = (hasAIC || brokerCount > 0) ? '#048395' : '#1a2733';
    const w = 180, h = 56;

    svg += '<g filter="url(#softShadow)">';
    svg += '<rect x="' + pos.x + '" y="' + pos.y + '" width="' + w + '" height="' + h + '" rx="10" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5"' + (dashArr ? ' stroke-dasharray="' + dashArr + '"' : '') + '/>';
    svg += '<text x="' + (pos.x + w/2) + '" y="' + (pos.y + 20) + '" text-anchor="middle" fill="' + textColor + '" font-family="Trebuchet MS, Arial, sans-serif" font-size="12" font-weight="700">' + escapeHtml(ag.name.toUpperCase()) + '</text>';
    if (hasAIC) {
      svg += '<text x="' + (pos.x + w/2) + '" y="' + (pos.y + 36) + '" text-anchor="middle" fill="#5a6b7a" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-style="italic">' + escapeHtml(ag.aic[0]) + '</text>';
    } else {
      svg += '<text x="' + (pos.x + w/2) + '" y="' + (pos.y + 36) + '" text-anchor="middle" fill="#5a6b7a" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-style="italic">sin AIC</text>';
    }
    if (brokerCount > 0) {
      svg += '<text x="' + (pos.x + w/2) + '" y="' + (pos.y + 50) + '" text-anchor="middle" fill="#048395" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-weight="600">' + brokerCount + ' broker(s)</text>';
    }
    svg += '</g>';
  }

  // Gold Pro especial (con AP Insurance debajo)
  const goldPosX = 720, goldPosY = 280;
  svg += '<path d="M 600 130 Q 700 200 ' + (goldPosX + 90) + ' ' + goldPosY + '" stroke="#06a3b6" stroke-width="1.5" fill="none" opacity="0.5"/>';
  if (goldPro) {
    const hasGoldAIC = goldPro.aic.length > 0;
    const goldBrokers = goldPro.brokers.length;
    svg += '<g filter="url(#softShadow)">';
    svg += '<rect x="' + goldPosX + '" y="' + goldPosY + '" width="180" height="56" rx="10" fill="' + (hasGoldAIC || goldBrokers > 0 ? '#e0f4f7' : '#eef2f7') + '" stroke="#06a3b6" stroke-width="1.5" stroke-dasharray="4 3"/>';
    svg += '<text x="' + (goldPosX + 90) + '" y="' + (goldPosY + 20) + '" text-anchor="middle" fill="#048395" font-family="Trebuchet MS, Arial, sans-serif" font-size="12" font-weight="700">GOLD PRO</text>';
    svg += '<text x="' + (goldPosX + 90) + '" y="' + (goldPosY + 36) + '" text-anchor="middle" fill="#5a6b7a" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-style="italic">' + (hasGoldAIC ? escapeHtml(goldPro.aic[0]) : 'sin AIC') + '</text>';
    if (goldBrokers > 0) svg += '<text x="' + (goldPosX + 90) + '" y="' + (goldPosY + 50) + '" text-anchor="middle" fill="#048395" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-weight="600">' + goldBrokers + ' broker(s)</text>';
    svg += '</g>';
  }

  // AP Insurance Services (subagencia)
  const apX = goldPosX - 10, apY = goldPosY + 100;
  svg += '<path d="M ' + (goldPosX + 90) + ' ' + (goldPosY + 56) + ' L ' + (apX + 100) + ' ' + apY + '" stroke="#e8a317" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>';
  if (apInsurance) {
    const hasApAIC = apInsurance.aic.length > 0;
    svg += '<g filter="url(#softShadow)">';
    svg += '<rect x="' + apX + '" y="' + apY + '" width="200" height="56" rx="10" fill="#fff4e0" stroke="#e8a317" stroke-width="1.5"/>';
    svg += '<text x="' + (apX + 100) + '" y="' + (apY + 20) + '" text-anchor="middle" fill="#8a6410" font-family="Trebuchet MS, Arial, sans-serif" font-size="11" font-weight="700">↳ AP INSURANCE SERVICES</text>';
    svg += '<text x="' + (apX + 100) + '" y="' + (apY + 35) + '" text-anchor="middle" fill="#8a6410" font-family="Trebuchet MS, Arial, sans-serif" font-size="9" font-style="italic">subagencia · sin Gold Pro AIC</text>';
    svg += '<text x="' + (apX + 100) + '" y="' + (apY + 50) + '" text-anchor="middle" fill="#8a6410" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-weight="600">AIC: ' + (hasApAIC ? escapeHtml(apInsurance.aic[0]) : '—') + '</text>';
    svg += '</g>';
  }

  // ===== FRIENDS =====
  svg += '<line x1="50" y1="640" x2="1250" y2="640" stroke="#d8e1ea" stroke-width="1" stroke-dasharray="3 5"/>';

  svg += '<ellipse cx="650" cy="730" rx="120" ry="44" fill="url(#friendsGrad)" filter="url(#softShadow)"/>';
  svg += '<text x="650" y="722" text-anchor="middle" fill="white" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="700">FRIENDS</text>';
  svg += '<text x="650" y="740" text-anchor="middle" fill="white" font-family="Trebuchet MS, Arial, sans-serif" font-size="11" opacity="0.9">Grupo afiliado</text>';
  if (friendsMatrix && friendsMatrix.aic.length > 0) {
    svg += '<text x="650" y="758" text-anchor="middle" fill="white" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-weight="600" opacity="0.95">AIC: ' + escapeHtml(friendsMatrix.aic[0]) + '</text>';
  }

  // Friends positions
  const friendsPositions = [
    {x: 120, y: 870}, {x: 290, y: 900}, {x: 470, y: 920}, {x: 660, y: 920}, {x: 850, y: 900}
  ];
  let fIdx = 0;
  for (const ag of friendsAgencies) {
    if (fIdx >= friendsPositions.length) break;
    const pos = friendsPositions[fIdx];
    const hasAIC = ag.aic.length > 0;
    const brokerCount = ag.brokers.length;
    const fill = hasAIC || brokerCount > 0 ? '#ece9fb' : '#eef2f7';
    const stroke = hasAIC || brokerCount > 0 ? '#5a4fcf' : '#5a6b7a';
    const dashArr = (!hasAIC && brokerCount === 0) ? '4 3' : '';
    const textColor = hasAIC || brokerCount > 0 ? '#463cab' : '#1a2733';

    svg += '<path d="M ' + (650 + (pos.x < 650 ? -100 : 100)) + ' 760 Q ' + ((650 + pos.x)/2) + ' ' + ((760 + pos.y)/2) + ' ' + (pos.x + 90) + ' ' + pos.y + '" stroke="#5a4fcf" stroke-width="1.5" fill="none" opacity="0.5"/>';

    svg += '<g filter="url(#softShadow)">';
    svg += '<rect x="' + pos.x + '" y="' + pos.y + '" width="180" height="56" rx="10" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5"' + (dashArr ? ' stroke-dasharray="' + dashArr + '"' : '') + '/>';
    svg += '<text x="' + (pos.x + 90) + '" y="' + (pos.y + 20) + '" text-anchor="middle" fill="' + textColor + '" font-family="Trebuchet MS, Arial, sans-serif" font-size="12" font-weight="700">' + escapeHtml(ag.name.toUpperCase()) + '</text>';
    svg += '<text x="' + (pos.x + 90) + '" y="' + (pos.y + 36) + '" text-anchor="middle" fill="#5a6b7a" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-style="italic">' + (hasAIC ? escapeHtml(ag.aic[0]) : 'sin AIC') + '</text>';
    if (brokerCount > 0) {
      svg += '<text x="' + (pos.x + 90) + '" y="' + (pos.y + 50) + '" text-anchor="middle" fill="' + textColor + '" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-weight="600">' + brokerCount + ' broker(s)</text>';
    } else if (ag.kind === 'no_data') {
      svg += '<text x="' + (pos.x + 90) + '" y="' + (pos.y + 50) + '" text-anchor="middle" fill="#5a6b7a" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-style="italic">sin agentes</text>';
    }
    svg += '</g>';
    fIdx++;
  }

  // ===== PENDIENTES =====
  svg += '<line x1="50" y1="1010" x2="1250" y2="1010" stroke="#e8a317" stroke-width="1" stroke-dasharray="3 5"/>';
  svg += '<text x="650" y="1045" text-anchor="middle" fill="#8a6410" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="700">Pendientes por aclarar</text>';

  // Spartans + CB Insurance
  const pPositions = [{x: 430, y: 1070}, {x: 690, y: 1070}];
  for (let i = 0; i < STRUCTURE.pending.length; i++) {
    const ag = STRUCTURE.pending[i];
    const pos = pPositions[i];
    const isHold = ag.kind === 'on_hold';
    const fill = isHold ? '#fde2e2' : '#fff4e0';
    const stroke = isHold ? '#d64545' : '#e8a317';
    const textColor = isHold ? '#d64545' : '#8a6410';

    svg += '<g filter="url(#softShadow)">';
    svg += '<rect x="' + pos.x + '" y="' + pos.y + '" width="220" height="80" rx="14" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5"/>';
    svg += '<text x="' + (pos.x + 110) + '" y="' + (pos.y + 22) + '" text-anchor="middle" fill="' + textColor + '" font-family="Trebuchet MS, Arial, sans-serif" font-size="14" font-weight="700">' + escapeHtml(ag.name) + '</text>';
    svg += '<text x="' + (pos.x + 110) + '" y="' + (pos.y + 38) + '" text-anchor="middle" fill="' + textColor + '" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-style="italic">' + (isHold ? 'On Hold' : '¿Hero o Friends?') + '</text>';
    if (ag.aic.length > 0) {
      svg += '<text x="' + (pos.x + 110) + '" y="' + (pos.y + 56) + '" text-anchor="middle" fill="' + textColor + '" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-weight="600">AIC: ' + escapeHtml(ag.aic[0]) + '</text>';
    }
    if (ag.brokers.length > 0) {
      svg += '<text x="' + (pos.x + 110) + '" y="' + (pos.y + 70) + '" text-anchor="middle" fill="' + textColor + '" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-weight="600">' + ag.brokers.length + ' broker(s)</text>';
    }
    svg += '</g>';
  }

  svg += '</svg>';
  document.getElementById('map-wrapper').innerHTML = svg;
}

// ==================== VIEW SWITCHING ====================
function switchView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector('[data-view="' + view + '"]').classList.add('active');
}

// ==================== DOWNLOADS ====================
function downloadSVG() {
  const svg = document.getElementById('conceptMap');
  const svgClone = svg.cloneNode(true);
  svgClone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const svgData = new XMLSerializer().serializeToString(svgClone);
  const fullSvg = '<?xml version="1.0" encoding="UTF-8"?>\n' + svgData;
  const blob = new Blob([fullSvg], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'organigrama-agencias-hero.svg';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadPNG() {
  const svg = document.getElementById('conceptMap');
  const svgClone = svg.cloneNode(true);
  svgClone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const svgData = new XMLSerializer().serializeToString(svgClone);
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const scale = 2;
  canvas.width = 1300 * scale; canvas.height = 1180 * scale;
  const img = new Image();
  const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);
  img.onload = function() {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob(function(pngBlob) {
      const pngUrl = URL.createObjectURL(pngBlob);
      const a = document.createElement('a');
      a.href = pngUrl; a.download = 'organigrama-agencias-hero.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(pngUrl);
    }, 'image/png');
  };
  img.onerror = function() { alert('No se pudo generar el PNG. Intenta descargar el SVG.'); URL.revokeObjectURL(url); };
  img.src = url;
}

buildStats();
buildMap();
buildDetailedView();
