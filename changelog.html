<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Historial de cambios y mejoras del Hero Hub.">
<link rel="icon" type="image/png" href="icons/favicon-hero.png">
<link rel="apple-touch-icon" href="icons/favicon-hero.png">
<meta name="theme-color" content="#06a3b6">
<title>Changelog — Hero Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/user-menu.js"></script>
<script defer src="https://unpkg.com/lucide@0.474.0"></script>
<script defer src="js/topbar-dropdown.js"></script>
</head>
<body>
<script>try{var t=localStorage.getItem("hero-theme");if(t)document.body.dataset.theme=t;}catch(e){}</script>
<script>try{var r=localStorage.getItem("hero-user-role");if(r){document.body.classList.add("skip-loading","role-"+r);}}catch(e){}</script>

<noscript>
  <div style="position:fixed;inset:0;background:#062a33;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:system-ui,sans-serif;z-index:99999;">
    <div>
      <h1 style="margin:0 0 12px;">Hero Hub requiere JavaScript</h1>
      <p style="margin:0;opacity:.85;">Activa JavaScript en tu navegador para acceder al Hero Hub.</p>
    </div>
  </div>
</noscript>

<div id="loading" class="login-container"><div class="login-card"><p>Verificando acceso...</p></div></div>

<div id="dashboard" style="display:none;">

  <header class="hero-topbar">
    <div class="topbar-inner">
      <div class="brand-block">
        <a href="index.html" class="brand-link">
          <div class="logo-mark"><img src="icons/favicon-hero.png" alt="Hero"></div>
          <div>
            <div class="brand-name">HERO HUB</div>
            <div class="brand-sub">Hero Insurance USA</div>
          </div>
        </a>
      </div>
      <nav class="topbar-nav" id="topbar-nav">
        <a href="index.html" class="nav-link"><i data-lucide="home"></i><span>Inicio</span></a>
        <a href="equipo.html" class="nav-link"><i data-lucide="users"></i><span>Equipo</span></a>

        <div class="nav-group">
          <button class="nav-group-toggle" type="button" aria-expanded="false" aria-haspopup="true">
            <i data-lucide="briefcase"></i><span>Operaciones</span>
            <i data-lucide="chevron-down" class="nav-group-arrow"></i>
          </button>
          <div class="nav-dropdown" role="menu">
            <a href="portales.html" class="nav-link" role="menuitem"><i data-lucide="shield"></i><span>Portales</span></a>
            <a href="agencias.html" class="nav-link" role="menuitem"><i data-lucide="network"></i><span>Agencias</span></a>
            <a href="directorio.html" class="nav-link" role="menuitem"><i data-lucide="book-user"></i><span>Directorio</span></a>
          </div>
        </div>

        <div class="nav-group">
          <button class="nav-group-toggle" type="button" aria-expanded="false" aria-haspopup="true">
            <i data-lucide="library"></i><span>Recursos</span>
            <i data-lucide="chevron-down" class="nav-group-arrow"></i>
          </button>
          <div class="nav-dropdown" role="menu">
            <a href="guias.html" class="nav-link" role="menuitem"><i data-lucide="book-open"></i><span>Guías</span></a>
            <a href="politicas.html" class="nav-link" role="menuitem"><i data-lucide="scroll-text"></i><span>Políticas</span></a>
            <a href="onboarding.html" class="nav-link" role="menuitem"><i data-lucide="rocket"></i><span>Onboarding</span></a>
            <a href="reuniones.html" class="nav-link" role="menuitem"><i data-lucide="presentation"></i><span>Reuniones</span></a>
          </div>
        </div>

        <a href="changelog.html" class="nav-link active"><i data-lucide="sparkles"></i><span>Changelog</span></a>
      </nav>
      <div class="topbar-actions">
        <button id="btn-logout" class="icon-btn" title="Salir" style="display:none;"><i data-lucide="log-out"></i></button>

        <div class="user-menu-wrap">
          <button id="user-avatar-btn" class="user-avatar-btn" type="button" aria-label="Menú de usuario" aria-haspopup="true" aria-expanded="false">
            <img id="user-avatar" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" class="avatar">
          </button>
          <div id="user-menu" class="user-menu" role="menu" hidden>
            <div class="user-menu-header">
              <img id="user-menu-avatar" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" class="user-menu-photo">
              <div class="user-menu-info">
                <div class="user-menu-name" id="user-menu-name">—</div>
                <div class="user-menu-email" id="user-menu-email">—</div>
                <div class="user-menu-role" id="user-menu-role" hidden></div>
              </div>
            </div>
            <div class="user-menu-divider"></div>
            <button id="user-menu-profile" class="user-menu-item" type="button" role="menuitem">
              <i data-lucide="user"></i><span>Mi perfil</span>
            </button>
            <a href="admin.html" id="user-menu-admin" class="user-menu-item" role="menuitem" hidden>
              <i data-lucide="shield-check"></i><span>Admin</span>
            </a>
            <div class="user-menu-divider"></div>
            <button id="user-menu-theme" class="user-menu-item" type="button" role="menuitem">
              <i data-lucide="sun"></i><span>Cambiar a noche</span>
            </button>
            <div class="user-menu-divider"></div>
            <button id="user-menu-logout" class="user-menu-item user-menu-item-danger" type="button" role="menuitem">
              <i data-lucide="log-out"></i><span>Cerrar sesión</span>
            </button>
          </div>
        </div>
        <button id="btn-menu" class="icon-btn menu-toggle" title="Menú"><i data-lucide="menu"></i></button>
      </div>
    </div>
  </header>

  <main class="page">

    <section class="page-header">
      <div class="page-kicker">• Hero Insurance USA •</div>
      <h1 class="page-title">Changelog</h1>
      <p class="page-sub">Historial de cambios y mejoras del Hero Hub</p>
    </section>

    <section class="changelog-toolbar">
      <div class="changelog-filters" id="changelog-filters">
        <button class="changelog-filter is-active" data-cat="all" type="button">
          <i data-lucide="list"></i><span>Todos</span>
        </button>
        <button class="changelog-filter" data-cat="feat" type="button">
          <i data-lucide="sparkles"></i><span>Nuevo</span>
        </button>
        <button class="changelog-filter" data-cat="fix" type="button">
          <i data-lucide="wrench"></i><span>Arreglos</span>
        </button>
        <button class="changelog-filter" data-cat="refactor" type="button">
          <i data-lucide="refresh-cw"></i><span>Mejoras</span>
        </button>
        <button class="changelog-filter" data-cat="style" type="button">
          <i data-lucide="palette"></i><span>Diseño</span>
        </button>
        <button class="changelog-filter" data-cat="chore" type="button">
          <i data-lucide="hammer"></i><span>Mantenimiento</span>
        </button>
      </div>
      <div class="changelog-stats">
        <div class="stat-pill"><strong id="stat-entries">0</strong> entradas</div>
      </div>
    </section>

    <section class="changelog-list" id="changelog-list">
      <div class="changelog-loading">Cargando historial…</div>
    </section>

  </main>

  <footer class="hero-footer">
    <span>HERO HUB · v2.8.0</span><span class="sep">•</span><span>HERO INSURANCE USA</span>
  </footer>
</div>

<script>
  window.refreshIcons = () => { if (window.lucide) lucide.createIcons(); };
  document.addEventListener("DOMContentLoaded", () => {
    window.refreshIcons();
    const menuBtn = document.getElementById("btn-menu");
    const nav = document.getElementById("topbar-nav");
    if (menuBtn && nav) menuBtn.addEventListener("click", () => nav.classList.toggle("open"));
  });
</script>
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/page-guard.js"></script>
<script type="module" src="js/changelog.js"></script>
<script type="module" src="js/tracker.js"></script>
</body>
</html>
